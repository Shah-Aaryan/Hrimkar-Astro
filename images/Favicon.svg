<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2B3A67"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>

    <!-- Planet Gradient -->
    <linearGradient id="planetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C451"/>
      <stop offset="50%" stop-color="#E0A82E"/>
      <stop offset="100%" stop-color="#C0841A"/>
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD978" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F5C451" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGradient)"/>

  <!-- Planet Ring -->
  <ellipse cx="32" cy="36" rx="24" ry="8"
           fill="none"
           stroke="url(#ringGradient)"
           stroke-width="3"
           transform="rotate(-15 32 36)"
           filter="url(#glow)" />

  <!-- Planet -->
  <circle cx="32" cy="32" r="14"
          fill="url(#planetGradient)"
          filter="url(#glow)" />

  <!-- Planet Bands -->
  <ellipse cx="32" cy="29" rx="10" ry="2" fill="#FFFFFF" opacity="0.15"/>
  <ellipse cx="32" cy="34" rx="9" ry="1.8" fill="#FFFFFF" opacity="0.12"/>

  <!-- Star -->
  <polygon points="48,14 50,18 54,20 50,22 48,26 46,22 42,20 46,18"
           fill="#FFFFFF"
           opacity="0.9"/>
</svg>